<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Liquid Glass Media Player</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.18);
      --glass-border: rgba(255, 255, 255, 0.35);
      --glass-shine: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Vibrant animated gradient mesh to show off glass translucency */
      background: radial-gradient(circle at 10% 20%, #ff4b2b, transparent 40%),
                  radial-gradient(circle at 90% 80%, #ff416c, transparent 40%),
                  radial-gradient(circle at 50% 50%, #8a2387, #e94057, #f27121);
      background-size: 150% 150%;
      overflow: hidden;
    }

    /* AUTHENTIC APPLE LIQUID GLASS CONTAINER */
    .glass-card {
      width: 420px;
      padding: 28px;
      border-radius: 32px;
      background: var(--glass-bg);
      
      /* Apple Vibrancy Engine Simulation */
      backdrop-filter: blur(35px) saturate(200%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);

      /* Multi-layered Glass Lighting */
      border: 1px solid var(--glass-border);
      box-shadow: 
        var(--glass-shadow),
        inset 0 1.5px 1px var(--glass-shine),
        inset 0 -1px 1px rgba(0, 0, 0, 0.1);
      
      position: relative;
      overflow: hidden;
      color: var(--text-main);
    }

    /* Specular Reflection Overlay */
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(
        180deg, 
        rgba(255, 255, 255, 0.15) 0%, 
        rgba(255, 255, 255, 0) 100%
      );
      pointer-events: none;
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
    }

    /* ARTWORK DISPLAY */
    .artwork-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      margin-bottom: 24px;
    }

    .artwork-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* TRACK METADATA */
    .track-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .track-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .track-artist {
      font-size: 14px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* TIMELINE / PROGRESS SLIDER */
    .progress-container {
      margin-bottom: 24px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .progress-fill {
      width: 42%;
      height: 100%;
      background: #ffffff;
      border-radius: 3px;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 8px;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 28px;
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover {
      transform: scale(1.08);
      opacity: 0.9;
    }

    .btn-play {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    /* ACTIVE LISTENING PLAYERS LIST */
    .players-section {
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 16px;
    }

    .players-header {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }

    .player-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .player-name {
      font-size: 13px;
      font-weight: 500;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <!-- Album Artwork -->
    <div class="artwork-container">
      <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop" alt="Album Art">
    </div>

    <!-- Track Information -->
    <div class="track-info">
      <div>
        <div class="track-title">Midnight Resonance</div>
        <div class="track-artist">Aura & The Echoes</div>
      </div>
      <button class="btn" style="opacity: 0.7;">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
    </div>

    <!-- Timeline Progress -->
    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="time-labels">
        <span>1:42</span>
        <span>3:55</span>
      </div>
    </div>

    <!-- Media Controls -->
    <div class="controls">
      <button class="btn">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="btn btn-play">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M16 18h2V6h-2zm-11.5-6l8.5 6V6z"/></svg>
      </button>
    </div>

    <!-- Connected Players / Listeners List -->
    <div class="players-section">
      <div class="players-header">Listening Together</div>
      
      <div class="player-row">
        <div class="player-profile">
          <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop" alt="User 1">
          <span class="player-name">Alex Rivera</span>
        </div>
        <span class="status-badge">Host</span>
      </div>

      <div class="player-row">
        <div class="player-profile">
          <img class="avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop" alt="User 2">
          <span class="player-name">Marcus Chen</span>
        </div>
        <span class="status-badge" style="opacity:0.7;">Synced</span>
      </div>
    </div>
  </div>

</body>
</html>
